name: Publish to NPM

# Publishes only when the version in package.json is ahead of the version on
# npm, so a merge that leaves the version alone skips the publish cleanly. A
# release is a deliberate PR that bumps the version. Follows payload-mailing's
# version-and-publish.yml, but keeps this repo's NPM_TOKEN authentication and
# its test and build steps.
on:
  push:
    branches:
      - main
  # Retries a failed publish without needing another push to main.
  workflow_dispatch: {}

# Two merges in quick succession must not race to publish and tag one version.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch can be started from any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Tags are needed to tell whether this version was already released.
          fetch-depth: 0

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          # A package that was never published reads as 0.0.0. Any other npm
          # failure stops here rather than guessing, because a wrong answer
          # either skips a release or tries to publish over an existing one.
          NPM_ERR="$RUNNER_TEMP/npm-view.err"
          if NPM_VERSION="$(npm view "$PKG_NAME" version 2>"$NPM_ERR")"; then
            :
          elif grep -q 'E404' "$NPM_ERR"; then
            NPM_VERSION="0.0.0"
            echo "::notice::$PKG_NAME has never been published to npm."
          else
            cat "$NPM_ERR"
            echo "::error::Could not read the published version of $PKG_NAME from npm."
            exit 1
          fi

          echo "package.json version: $PKG_VERSION"
          echo "npm latest version:   $NPM_VERSION"

          # True when $1 is a strictly higher version than $2. sort -V alone
          # ranks 1.0.0-rc.1 above 1.0.0; turning the prerelease "-" into "~",
          # which sort -V orders before anything, restores semver order.
          is_newer() {
            a="$(printf '%s' "$1" | sed 's/-/~/')"
            b="$(printf '%s' "$2" | sed 's/-/~/')"
            [ "$a" != "$b" ] && [ "$(printf '%s\n%s\n' "$a" "$b" | sort -V | tail -n1)" = "$a" ]
          }

          if is_newer "$PKG_VERSION" "$NPM_VERSION"; then
            echo "package.json is ahead of npm - will publish v$PKG_VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::package.json ($PKG_VERSION) is not ahead of npm ($NPM_VERSION) - nothing to publish. Bump the version in package.json to cut a release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Install, tests and build run on every push to main, release or not. This
      # workflow is the only place this repo runs them, so gating them on a
      # release would leave every ordinary merge to main untested.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Abort if tag already exists
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists but npm does not have $VERSION. Bump package.json to a new version to release."
            exit 1
          fi

      - name: Publish to NPM
        if: steps.decide.outputs.publish == 'true'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tagged only after npm accepted the package. The tag used to be pushed
      # first, so a publish that then failed left v0.0.21 and v0.0.22 tagged
      # but never on npm - and the tag that exists blocks retrying that version.
      - name: Create and push git tag
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
